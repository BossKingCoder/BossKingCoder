<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1F6FEB" flood-opacity="0.45"/>
    </filter>
    <clipPath id="pill">
      <rect x="8" y="6" width="304" height="56" rx="28"/>
    </clipPath>
  </defs>

  <rect x="8" y="6" width="304" height="56" rx="28" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#pill)">
    <rect x="-80" y="0" width="60" height="72" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-80;420;420" keyTimes="0;0.5;1" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pen icon -->
  <g transform="translate(44 22)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 3l4 4L8 20H4v-4z"/>
    <path d="M14 6l4 4"/>
  </g>

  <text x="160" y="41.5" text-anchor="middle" fill="#fff"
        font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="0.3">Read my blog</text>

  <!-- arrow, nudges right -->
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M248 34h20M261 27l7 7-7 7">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
